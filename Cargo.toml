[package]
edition      = "2024"
license      = "MIT"
name         = "watcher"
rust-version = "1.92.0"
version      = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
dunce = "1"
globset = "0.4"
napi = { version = "3", default-features = false, features = [
  "async",
  "napi10",
] }
napi-derive = "3"
notify = "8"
notify-debouncer-full = "0.7"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto           = true
strip         = "symbols"
